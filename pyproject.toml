[project]
name = "raguard"
version = "0.1.0"
description = "Self-healing hybrid RAG with automated evaluation CI/CD"
readme = "README.md"
requires-python = ">=3.11,<3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running pgvector database and ingested corpus",
    "heavy: downloads or runs local transformer models",
    "llm: consumes LLM provider quota",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
