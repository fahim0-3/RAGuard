[project]
name = "raguard"
version = "0.1.0"
description = "Self-healing hybrid RAG with automated evaluation CI/CD"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "google-genai>=2.19,<3",
    "httpx>=0.28,<1",
    "langchain-core>=1.6,<2",
    "langchain-google-genai>=4.3,<5",
    "langchain-groq>=1.1,<2",
    "langchain-openai>=1.6,<2",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "pgvector>=0.5,<1",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "rank-bm25==0.2.2",
    "redis>=8.1,<9",
    "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
    # Import-only fast-test surface. Keeping it in the same lock preserves a
    # sub-minute CI tier without installing the model stack.
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "langchain-core>=1.6,<2",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "pgvector>=0.5,<1",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
    "rank-bm25==0.2.2",
    "redis>=8.1,<9",
    "ruff>=0.15,<1",
]
evaluation = [
    # Ragas 0.4.3 still imports a VertexAI module removed in
    # langchain-community 0.4.2. The 0.4.1 pair is import-tested with Core 1.x.
    "datasets>=4.5,<5",
    "langchain-community==0.4.1",
    "ragas==0.4.3",
]
frontend = [
    "httpx>=0.28,<1",
    "streamlit>=1.62,<2",
]
smoke = ["httpx>=0.28,<1"]
local-models = [
    "sentence-transformers>=6,<7",
    "torch>=2.10,<3",
    "transformers>=5.2,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running pgvector database and ingested corpus",
    "heavy: downloads or runs local transformer models",
    "llm: consumes LLM provider quota",
    # `slow` implies integration and heavy, but is deliberately NOT marked
    # `integration`, so that `-m \"integration and not llm\"` stays a usable gate.
    # Reranking 20 candidates for every golden case is ~1000 cross-encoder
    # forward passes; on CPU that is minutes, not seconds. Run with `-m slow`.
    "slow: minutes-long; runs the real cross-encoder over the whole dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
default-groups = ["dev", "frontend"]
required-version = "==0.11.6"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
