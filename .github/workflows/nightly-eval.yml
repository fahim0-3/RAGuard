name: Nightly evaluation

# Tier 2: end-to-end and Ragas metrics. These call an LLM, so they cost quota
# and vary between runs on identical code. They are reported as evidence and
# never block a merge; blocking on a flaky metric teaches the team to ignore
# the gate, which defeats the purpose of the gate.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        type: choice
        options: [e2e, ragas, both]
        default: both

jobs:
  llm-evaluation:
    name: LLM-judged evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguard
          POSTGRES_PASSWORD: raguard
          POSTGRES_DB: raguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguard -d raguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://raguard:raguard@localhost:5432/raguard
      MODEL_DEVICE: cpu
      HF_HOME: ${{ github.workspace }}/.hf-cache
      LLM_PROVIDER: gemini
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-bge-m3-reranker-v2-m3-v1

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev --group evaluation --group local-models

      - name: Enable pgvector extension
        # The pgvector image ships the extension but does not enable it in any
        # database. docker-compose mounts docker/init-db.sql to do that
        # locally; GitHub Actions `services:` cannot mount a workspace file,
        # so it has to happen here.
        #
        # It must happen before anything opens the pool. The pool's `configure`
        # callback runs register_vector() on every connection, which raises
        # "vector type not found" without the extension, so no connection ever
        # becomes available and callers wait out the full 30s pool timeout.
        # init_schema() cannot bootstrap it either: its own CREATE EXTENSION
        # needs a pooled connection it can never obtain.
        env:
          PGPASSWORD: raguard
        run: psql -h localhost -p 5432 -U raguard -d raguard -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Ingest corpus
        run: uv run --frozen --no-sync python -m src.ingestion.ingest --reset

      - name: Generation and safety evaluation
        if: inputs.tier != 'ragas'
        # Safety is scored from the same run, so a retrieval or generation gain
        # cannot mask a fabricated-citation regression.
        run: |
          uv run --frozen --no-sync python -m src.evaluation.run_eval \
            --generation --safety \
            --output reports/nightly_generation.json

      - name: RAGAS evaluation
        if: inputs.tier != 'e2e'
        # Reports RAGAS_NOT_AVAILABLE rather than failing when the library
        # cannot import; the step must not turn a dependency break into a
        # metric result either way.
        run: |
          uv run --frozen --no-sync python -m src.evaluation.run_eval \
            --generation --ragas \
            --output reports/nightly_ragas.json

      - name: Publish summary
        if: always()
        # Reads the Phase I report shape (layers + gates). Tolerates a missing
        # or partial report so a failed evaluation still produces a summary
        # explaining what was blocked.
        run: |
          echo "## Nightly evaluation" >> "$GITHUB_STEP_SUMMARY"
          for report in reports/nightly_*.json; do
            [ -e "$report" ] || continue
            echo "### $(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            uv run --frozen --no-sync python - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps({
              "gates": data.get("gates", {}).get("by_category", {}),
              "status": data.get("gates", {}).get("status"),
              "failures": data.get("gates", {}).get("failures", []),
              "layers": {k: v.get("status") for k, v in data.get("layers", {}).items()},
              "metrics": {k: v.get("metrics", {}) for k, v in data.get("layers", {}).items()},
          }, indent=2))
          PY
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evaluation-${{ github.run_id }}
          path: reports/
          retention-days: 90
